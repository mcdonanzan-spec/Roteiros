
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SP Route Optimizer & Housing Agent</title>
    <meta name="description" content="Planejador logístico estratégico de visitas técnicas a canteiros de obras em São Paulo e recomendação de hub de moradia.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #f8fafc;
            color: #1e293b;
        }
        
        button, a { cursor: pointer !important; }

        /* Estilos para o modo de exportação de PDF */
        .pdf-export-mode {
            background-color: white !important;
            padding: 30px !important;
            width: 1000px !important; /* Largura ideal para A4 */
            box-sizing: border-box !important;
        }
        
        .pdf-export-mode .shadow-sm, 
        .pdf-export-mode .shadow-md, 
        .pdf-export-mode .shadow-lg, 
        .pdf-export-mode .shadow-xl, 
        .pdf-export-mode .shadow-2xl {
            box-shadow: none !important;
            border: 1px solid #e2e8f0 !important;
        }

        .pdf-export-mode #pdf-page-1,
        .pdf-export-mode #pdf-page-2,
        .pdf-export-mode #pdf-page-3,
        .pdf-export-mode #pdf-page-4 {
            overflow: visible !important;
        }

        .pdf-export-mode .site-name-title {
            white-space: normal !important;
            overflow: visible !important;
            word-break: break-word !important;
            line-height: 1.4 !important;
            padding-top: 6px !important;
            padding-bottom: 4px !important;
            display: block !important;
            font-size: 11px !important;
        }

        @media print {
            .no-print { display: none !important; }
            .page-break { page-break-before: always; }
            body { background: white; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
